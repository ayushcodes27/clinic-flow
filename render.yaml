services:
  # Spring Boot 3 Backend API & WebSocket Service
  - type: web
    name: clinicflow-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /swagger-ui/index.html
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: clinicflow-db
          property: connectionString
      - key: SPRING_DATA_REDIS_HOST
        value: red-placeholder
      - key: SPRING_DATA_REDIS_PORT
        value: 6379
      - key: JWT_SECRET
        generateValue: true

  # Vite + React Frontend Static Site
  - type: web
    name: clinicflow-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: npm run build
    staticPublishPath: ./frontend/dist
    rootDir: ./frontend
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: clinicflow-backend
          property: host

databases:
  - name: clinicflow-db
    plan: free
    region: oregon
    databaseName: clinicflow
    user: clinic_user
